#
# vala-lint configuration for Tuner
#
# Tuned to the existing house style rather than elementary's defaults:
# opening braces on their own line, no space before call parentheses,
# `using` directives, and column-aligned assignments/declarations.

[Checks]
# Braces go on the next line (Allman style)
block-opening-brace-space-before=off
# `foo()` and `foo ()` are both used; neither is enforced
space-before-paren=off
# `using Gtk;` etc. is the norm in this codebase
using-directive=off
# Indentation is mixed (tabs and spaces) across files; not enforced
use-of-tabs=off
# Multiple spaces are used deliberately to align `=` and declarations
double-spaces=off

# Kept, as warnings: genuine but non-critical hygiene issues
no-space=warn
trailing-whitespace=warn
line-length=warn
naming-convention=warn
unnecessary-string-template=warn
note=warn

# Kept as errors: almost always a real mistake
double-semicolon=error
ellipsis=error
trailing-newlines=error

[Disabler]
disable-by-inline-comments=true

[line-length]
max-line-length=140
ignore-comments=true

[naming-convention]
exceptions=UUID,

[note]
keywords=TODO,FIXME,
